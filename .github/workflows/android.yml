# Builds the Android app (android/): the Go side with gomobile, then the
# APKs with Gradle, one per ABI and a universal one, uploaded as an
# artifact of the run. Called by the release workflow with a tag, it
# uploads them to that release too.
#
# Release builds are signed with the key of these secrets, or with the
# debug key without them:
#   MYGO_ANDROID_KEYSTORE           the keystore (.jks), in Base64
#   MYGO_ANDROID_KEYSTORE_PASSWORD
#   MYGO_ANDROID_KEY_ALIAS
#   MYGO_ANDROID_KEY_PASSWORD
# A key is made with:
#   keytool -genkeypair -v -keystore mygo-android.jks -alias mygo -keyalg RSA -keysize 4096 -validity 36500
#   base64 -w0 mygo-android.jks | gh secret set MYGO_ANDROID_KEYSTORE
name: Android

on:
  push:
    branches: [main, "android-*"]
    paths: ["android/**", "mobile/**", "internal/**", "go.mod", "go.sum", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "mobile/**", "internal/**", "go.mod", "go.sum", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "The release to upload the APKs to"
        type: string
        required: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the uploads to the release, when called with a tag
    env:
      NDK_VERSION: "29.0.14206865"
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test the Go side
        run: go test -tags with_gvisor ./mobile/
      - name: Install the SDK platform and the NDK
        # The runner has the Android SDK and Java 21.
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;$NDK_VERSION"
      - name: Build the Go library
        # ANDROID_HOME is the runner's, which ${{ env }} does not see.
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" android/build-aar.sh
      - name: Build the APKs
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.MYGO_ANDROID_KEYSTORE }}
          MYGO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MYGO_ANDROID_KEYSTORE_PASSWORD }}
          MYGO_ANDROID_KEY_ALIAS: ${{ secrets.MYGO_ANDROID_KEY_ALIAS }}
          MYGO_ANDROID_KEY_PASSWORD: ${{ secrets.MYGO_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export MYGO_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew dist --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: mygo-clash-android
          path: android/app/build/dist/*.apk
      - name: Upload to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber android/app/build/dist/*.apk
